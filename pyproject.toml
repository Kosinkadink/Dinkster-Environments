[project]
name = "dinkster-environments"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["packaging>=24.2", "zstandard>=0.25,<1", "boto3>=1.40,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[tool.pyright]
include = ["bundles.py", "publication.py", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
