name: Base bundles
on:
  push:
    branches: [main, base-bundles-552, tar-zstd-base-552, recover-missing-base-mirrors-552, windows-sqlite-runtime-570, mac-arm64-575]
    paths: [variants.toml, bundles.py, windows_sqlite.py, publication.py, pyproject.toml, uv.lock, .github/workflows/bases.yml]
permissions:
  contents: read
concurrency:
  group: bases-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linux-cpu
            runner: ubuntu-latest
          - variant: win-cpu
            runner: windows-latest
          - variant: win-nvidia
            runner: windows-latest
          - variant: win-nvidia-cu126
            runner: windows-latest
          - variant: mac-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          version: '0.11.29'
      - run: uv sync --locked --group sqlite-build
      - name: Verify pinned Windows Zig download and reproduce SQLite DLL
        if: runner.os == 'Windows'
        run: |
          uv run --locked --group sqlite-build python windows_sqlite.py build --output sqlite-check
          uv run --locked python - <<'PY'
          import json, tomllib
          from pathlib import Path
          expected = tomllib.loads(Path('variants.toml').read_text())['interpreters']['windows']['sqlite']
          actual = json.loads(Path('sqlite-check/sqlite.json').read_text())
          if actual != expected:
              raise SystemExit('SQLite build provenance or DLL hash differs from the pinned manifest')
          print('Reproduced pinned SQLite DLL:', actual['sha256'])
          PY
      - name: Read named engine commit
        id: source
        run: |
          uv run --locked python - <<'PY'
          import os, tomllib
          from pathlib import Path
          source = tomllib.loads(Path('variants.toml').read_text())['source']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"repository={source['repository']}\ncommit={source['commit']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Fetch newest published manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: uv run --locked python publication.py previous --variant "$VARIANT" --output previous.json
      - name: Compare base inputs
        id: plan
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          args=()
          if [ -f previous.json ]; then args=(--previous previous.json); fi
          uv run --locked python bundles.py plan --source source --variant "$VARIANT" --output plan.json "${args[@]}"
      - name: Build verified archive
        if: steps.plan.outputs.skip != 'true'
        run: uv run --locked --group sqlite-build python bundles.py build --manifest plan.json --output dist
      - name: Rebuild from manifest alone
        if: steps.plan.outputs.skip != 'true'
        run: |
          uv run --locked --group sqlite-build python bundles.py build --manifest dist/manifest.json --output rebuilt
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('dist/manifest.json').read_text())['id'] == json.loads(Path('rebuilt/manifest.json').read_text())['id']
          PY
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          name: base-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
  verify:
    needs: build
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linux-cpu
            runner: ubuntu-latest
          - variant: win-cpu
            runner: windows-latest
          - variant: win-nvidia
            runner: windows-latest
          - variant: win-nvidia-cu126
            runner: windows-latest
          - variant: mac-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          version: '0.11.29'
      - run: uv sync --locked
      - name: Find produced archive
        uses: actions/github-script@v7
        id: artifact
        env:
          VARIANT: ${{ matrix.variant }}
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId});
            core.setOutput('exists', data.artifacts.some(a => a.name === `base-${process.env.VARIANT}`));
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.exists == 'true'
        with:
          name: base-${{ matrix.variant }}
          path: dist
      - name: Extract tar+zstd and execute target interpreter
        if: steps.artifact.outputs.exists == 'true'
        run: uv run --locked python bundles.py verify --directory dist
  publish:
    needs: [build, verify]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    environment: base-publication
    strategy:
      fail-fast: false
      matrix:
        variant: [linux-cpu, win-cpu, win-nvidia, win-nvidia-cu126, mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          version: '0.11.29'
      - run: uv sync --locked
      - name: Download built archive if one exists
        uses: actions/github-script@v7
        id: artifact
        env:
          VARIANT: ${{ matrix.variant }}
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId});
            core.setOutput('exists', data.artifacts.some(a => a.name === `base-${process.env.VARIANT}`));
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.exists == 'true'
        with:
          name: base-${{ matrix.variant }}
          path: dist
      - name: Publish and retain bases
        if: steps.artifact.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: uv run --locked python publication.py publish --directory dist
      - name: Converge current release mirror even when rebuilding skips
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: uv run --locked python publication.py mirror --variant "$VARIANT"
