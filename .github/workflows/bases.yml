name: Base bundles
on:
  push:
    branches: [main, base-bundles-552]
    paths: [variants.toml, bundles.py, publication.py, uv.lock, .github/workflows/bases.yml]
permissions:
  contents: read
concurrency:
  group: bases-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [linux-cpu, win-cpu, win-nvidia, win-nvidia-cu126]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Read named engine commit
        id: source
        run: |
          uv run --locked python - <<'PY'
          import os, tomllib
          from pathlib import Path
          source = tomllib.loads(Path('variants.toml').read_text())['source']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"repository={source['repository']}\ncommit={source['commit']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Fetch newest published manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: uv run --locked python publication.py previous --variant "$VARIANT" --output previous.json
      - name: Compare base inputs
        id: plan
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          args=()
          if [ -f previous.json ]; then args=(--previous previous.json); fi
          uv run --locked python bundles.py plan --source source --variant "$VARIANT" --output plan.json "${args[@]}"
      - name: Install archive tool
        if: steps.plan.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y 7zip
      - name: Build verified archive
        if: steps.plan.outputs.skip != 'true'
        run: uv run --locked python bundles.py build --manifest plan.json --output dist
      - name: Rebuild from manifest alone
        if: steps.plan.outputs.skip != 'true'
        run: |
          uv run --locked python bundles.py build --manifest dist/manifest.json --output rebuilt
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('dist/manifest.json').read_text())['id'] == json.loads(Path('rebuilt/manifest.json').read_text())['id']
          PY
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          name: base-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BASE_PUBLICATION == 'true'
    permissions:
      contents: write
      actions: read
    environment: base-publication
    strategy:
      fail-fast: false
      matrix:
        variant: [linux-cpu, win-cpu, win-nvidia, win-nvidia-cu126]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Download built archive if one exists
        uses: actions/github-script@v7
        id: artifact
        env:
          VARIANT: ${{ matrix.variant }}
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId});
            core.setOutput('exists', data.artifacts.some(a => a.name === `base-${process.env.VARIANT}`));
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.exists == 'true'
        with:
          name: base-${{ matrix.variant }}
          path: dist
      - name: Publish and retain bases
        if: steps.artifact.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_BASE_PUBLICATION: ${{ vars.ENABLE_BASE_PUBLICATION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: uv run --locked python publication.py publish --directory dist
